 ITA_duceprincipio_desc: ""
 ITA_ascension_of_graziani: "亲密战友格拉齐亚尼"
 ITA_ascension_of_graziani_desc: "书赠：格拉齐亚尼同志\n西塞一生唯谨慎，加图大事不糊涂。\n贝尼托·墨索里尼"
 ITA_inner_circle_graziani_theory: "格拉齐亚尼计划"
 ITA_inner_circle_graziani_armed_blackshirts: "武装黑衫军"
 ITA_inner_circle_setting_of_again_from_roma: "从罗马再出发"
 ITA_inner_circle_setting_of_again_from_roma_desc: "我们从罗马再出发！极限军改！"
 ITA_ascension_of_balbo: "亲密战友巴尔博"
 ITA_ascension_of_balbo_desc: "老师老师，我怎么坐到第四排了。"
 ITA_inner_circle_balbo_national_flight_movent: "“全民飞行”运动"
 ITA_inner_circle_balbo_modern_air_force: "现代化空军"
 ITA_ascension_of_grandi: "亲密战友格兰迪"
 ITA_ascension_of_grandi_desc: "我在这个..可以算是四十年来，四十年来如一日，四十年来不断地提倡，这个人要自由，这个一个自由的国家，不是一帮奴才能够造成功的，只有...只有能够自由的人——爱自由如生命，爱自由如面包，爱自由比面包还重要、比生命还重要，只有这一种的——人！才可以造成一个自由的国家。"
 ITA_inner_circle_grandi_civil_code: "《民法典》"
 ITA_inner_circle_grandi_advancing_law-based_governance: "全面依法治国"
 ITA_ascension_of_ciano: "亲密战友齐亚诺"
 ITA_ascension_of_ciano_desc: "老人家，摆个渡行吗？...\n老乡，打扰了。"
 ITA_inner_circle_ciano_rectify: "整顿"
 ITA_inner_circle_ciano_rectify_desc: "忍耐..."
 ITA_inner_circle_ciano_the_three_guidelines: "三项指示为纲"
 ITA_inner_circle_ciano_the_three_guidelines_desc: "学习法团主义专政理论、安定团结、把国民经济搞上去"
 ITA_inner_circle_ciano_never_overturn_a_verdict: "永不翻案"
 ITA_inner_circle_ciano_never_overturn_a_verdict_desc: "...对我这样的人，怎样处理都不过份。我保证永不翻案，绝不愿做一个死不悔改的走资派。我的最大希望是能够留在党内，请求党在可能的时候分配我一个小小的工作，给我以补过从新的机会..."
 ITA_inner_circle_ciano_the_first_half_of_my_life: "《我的前半生》"
 ITA_inner_circle_ciano_the_first_half_of_my_life_desc: "齐亚诺是谁？我是意大利社会共和国公民加莱亚佐啊..."
 ITA_inner_circle_ciano_the_real_steel_company: "钢铁公司"
 ITA_inner_circle_ciano_the_real_steel_company_desc: "...就是想得开，挺得住！"
 ITA_ascension_of_ricci: "亲密战友里奇"
 ITA_ascension_of_ricci_desc: "我看呐，资本家不但不是我们的敌人，反而还是我们的朋友..."
 ITA_inner_circle_ricci_OND: "扩大康乐俱乐部职能"
 ITA_inner_circle_ricci_OND_desc: "三天不学习，赶不上里少奇"
 ITA_inner_circle_ricci_nationale_mediate: "国家调解"
 ITA_inner_circle_ricci_nationale_mediate_desc: "一切权力归法团主义祖国，一切事物都要在国家的框架内运行，即使是§R革命§!也不例外"
 ITA_inner_circle_ricci_grapple_with_key_issues_to_goverence: "抓纲治国"
 ITA_inner_circle_ricci_grapple_with_key_issues_to_goverence_desc: "阶级调和为纲，其余都是目！"
 ITA_ascension_of_bottai: "亲密战友博塔伊"
 ITA_ascension_of_bottai_desc: "报纸是宣传和组织的一支重要武器。"
 ITA_inner_circle_bottai_elementary_education_law: "初等教育法"
 ITA_inner_circle_bottai_elementary_education_law_desc: "是权利，也是义！务！"
 ITA_inner_circle_bottai_tracking_in_secondary_education: "中等教育分流"
 ITA_inner_circle_bottai_tracking_in_secondary_education_desc: "国家有义务为所有儿童提供初等教育，而中等与高等教育仅面向“值得且寻求它的人”"
 ITA_inner_circle_bottai_education_sector_a_black_line: "教育领域“一条黑线”"
 ITA_inner_circle_bottai_education_sector_a_black_line_desc: "掀起教育革命的风暴，和资产阶级教育路线实行最彻底的决裂！"
 ITA_ascension_of_acerbo: "亲密战友阿切尔博"
 ITA_ascension_of_acerbo_desc: "二波（尔博）呀，墨主席下决心要做的事，你可以表示反对，但不要轻易表示反对。在历史上，有几次，我曾认为主席的决策不对，表示反对，但过一段时间都证明他的决策是对的。以后我就谨慎了，不轻易表示反对了。但后来又有一次，我确信主席错了，我坚决表示反对，但实践又证明是主席对了..."
 ITA_inner_circle_acerbo_land_redistribution: "土地改革"
 ITA_inner_circle_acerbo_land_redistribution_desc: "麦子熟了几千次，人民万岁第一次。"
 ITA_inner_circle_acerbo_agricultural_collectivization: "农业集体化" 
 ITA_inner_circle_acerbo_agricultural_collectivization_desc: "“在我看来，面条一样小块的土地只能是死路一条。我无法想象，在世界上任何一个地方，只拥有小块土地的小农可以有什么长远的希望，而且他们当然不是意大利现在这样的只有四处分散的一两亩土地的小农......”"
 ITA_inner_circle_acerbo_corporatist_agricultural_modernization: "法团主义农业现代化"
 ITA_inner_circle_acerbo_corporatist_agricultural_modernization_desc: "要在不太长的历史时期内，把我国建设成为一个具有现代农业、现代工业、现代国防和现代科学技术的法团主义强国。"
 ITA_inner_circle_end_1: "地中海风今又是"
 ITA_inner_circle_end_1_desc: "现在的地中海，依旧海风萧瑟..."
 ITA_inner_circle_end_2: "换了人间"
 ITA_inner_circle_end_2_desc: "但是人间已经换了新颜。"