l_simp_chinese:
 SE_africa_national_liberty_war_T:0 "东非民族革命战争"
 SE_africa_national_liberty_war_D:0 "\n\n“国家要独立，民族要解放，人民要革命。”\n - 邓小平"
 SE_africa_national_liberty_war_A:0 "土地与自由"
 SE_italian_great_revolution_T:0 "意大利大革命"
 SE_italian_great_revolution_D:0 "\n\n“想要同侵略者继续抗争的，随我来。我无法给你们荣誉和报酬，只有饥饿、干渴、强行军、战斗和死亡。爱国者们，随我来。”\n - 朱塞佩·加里波第"
 SE_italian_great_revolution_A:0 "劳动，家庭，祖国！"
 SE_middle_east_war_T:0 "中东战争"
 SE_middle_east_war_D:0 "\n\n“完全解放巴勒斯坦是可行的。”\n - 塔米姆·巴尔古蒂"
 SE_middle_east_war_A:0 "并非解放"
 SE_italian_naval_aviation_T:0 "一着惊海天"
 SE_italian_naval_aviation_D:0 "\n\n\n才见虹霓君已去，英雄谢幕海天间。"
 SE_italian_naval_aviation_A:0 "我们也有自己的大航母了..."
 SE_memorial_of_mussolini_T:0 "刚才最后一响，是罗马时间十六点整"
 SE_memorial_of_mussolini_D:0 "\n\n\n“凭栏静听潇潇雨，故国人民有所思。”"
 SE_memorial_of_mussolini_A:0 "欲语泪先流..."

 SE_celebrate_for_great_turning_T:0 "粉碎“一人帮”"
 SE_celebrate_for_great_turning_D:0 "\n\n“沉舟侧畔千帆过，病树前头万木春。”\n - 刘禹锡"
 SE_celebrate_for_great_turning_A:0 "§A好！§!"