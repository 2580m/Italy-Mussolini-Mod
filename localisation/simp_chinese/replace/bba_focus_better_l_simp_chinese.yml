 ITA_naval_power_projection: "海军政治委员"
 ITA_naval_power_projection_desc: "我们要建立一支属于意大利人民的海上武装力量！"
 ITA_oto_naval_guns: "国营奥托·梅莱拉公司"
 ITA_italy_first: "自力更生"
 ITA_pact_of_steel: "一边倒"
 ITA_pact_of_steel_desc: "“你们一边倒。”正是这样。一边倒，是邓南遮的四年经验和战斗的意大利法西斯的十四年经验教给我们的，深知欲达到胜利和巩固胜利，必须一边倒。积四年和十四年的经验，意大利人不是倒向英美帝国主义一边，就是倒向法团主义一边，绝无例外。骑墙是不行的，第三条道路是没有的。我们反对倒向英美帝国主义一边的埃马努埃莱反动派，我们也反对第三条道路的幻想。"
 ITA_guarantee_austrian_independence: "小国转动大国"
 ITA_expand_rome_flying_school: "脱产飞行员"
 ITA_supremacy_in_the_skies: "天空属于意大利"
 ITA_has_disbanded_blackshirts_tt_NOT: "尚未解散黑衫军"
 ITA_la_battaglia_del_grano_desc: "藏粮于民，还征什么农业税！\n - 克拉拉同志在Bottai公社的讲话"
 ITA_la_battaglia_per_la_terra_desc: "农村是一个广阔的天地，在那里是可以大有作为的。"
 ITA_heroes_of_the_nation_desc: "回旋了，老干不怎么能这么万岁"
 ITA_capo_supremo_desc: "混进党里、政府里、军队里和各种文化界的资产阶级代表人物，是一批反进军的君主制分子，一旦时机成熟，他们就会要夺取政权，由法团主义专政变为资产阶级专政。这些人物，有些已被我们识破了，有些则还没有被识破，有些正在受到我们信用，被培养为我们的接班人，例如希特勒那样的人物，他们现正睡在我们的身旁，各级党委必须充分注意这一点。"
 