l_simp_chinese:
 ITA_naval_develop.3.t: "航空母舰吧"
 ITA_naval_develop.3.d: "最先注意到这件事的人，往往不是海军军官。\n\n罗马的报摊老板发现，近来卖得最快的报纸总会在首页印上一艘船。那船大得有些失真，烟囱、舰桥和飞行甲板占满了画面，几架飞机像苍蝇似的停在那里。买报纸的人常常先把画面端详一阵，再把报纸夹在胳膊底下。至于里面究竟写了什么，倒未必有人认真看。\n\n小孩子当然更喜欢这些东西。\n\n学校放学以后，几个男孩会蹲在街边，用石子在地上摆出舰队。他们把最大的石头叫作“航空母舰”，较小的就是巡洋舰和驱逐舰。意见不合的时候，便拿鞋尖踢掉对方的舰队，重新开始。偶尔有一个孩子声称自己知道真正的航母是什么样，其他人便围过去听；他其实只在报纸上见过。\n\n工厂里的情形稍有不同。\n\n午饭时间，工人们谈论航母，有时比谈论工资还起劲。有人觉得这种船大得荒唐，造一艘的钱足够买下半条街的房子；另一个人马上反驳，说若是飞机真的能从海上起飞，那么这钱花得再多也值得。争到最后，往往还是回到各自的口袋上。\n\n码头的老水手对此没有那么大的兴趣。\n\n他见过太多“改变时代”的新东西。第一次听说飞机能击沉军舰时，他也曾觉得稀奇；如今听人说，飞机不必从岸上起飞，停在一艘船上也行，只会吐出一句：“那船得够大。”\n\n不过到了晚上，他还是会站在酒馆门口，听年轻人争论哪一种航母最好。\n\n这股谈论并没有什么明确的中心。它从报纸流进街道，又从街道流进工厂、学校和咖啡馆。没有人正式宣布过“航空母舰时代已经到来”，可这个词已经越来越频繁地出现在人们嘴里，像一种尚未得到验证的预言。\n\n罗马城里，甚至有一家小酒馆换了招牌。\n\n没有人知道老板为什么给它取这个名字。\n\n只是那块新挂起来的牌子上，白漆写着两个英文单词：\n\nCarrier Bar。\n\n到了夜里，那里总有几张桌子，会为了同一件还没有真正建成的东西争论到很晚。"
 ITA_naval_develop.3.a: "连日本，法国都有航母，为什么意大利不能有"
 ITA_naval_develop.2.t: "海军的未来"
 ITA_naval_develop.2.d: "海军的发展方向已经成为摆在我们面前的重大问题。有人主张集中力量发展传统的重型水面舰艇，也有人认为，航空兵已经彻底改变了海战的形态。\n我们已经做出了决定：将国家有限的资源投入航空母舰及其配套舰载航空兵的发展，建立一支能够在远离本土的海域投射空中力量的现代化舰队。"
 ITA_naval_develop.2.a: "尊严只在剑锋之上！"
 ITA_naval_develop.1.t: "巨舰的时代"
 ITA_naval_develop.1.d: "海军的发展方向已经成为摆在我们面前的重大问题。航空兵正在改变海战，但我们仍然相信，强大的主力舰队才是国家制海权最可靠的支柱。\n我们已经做出了决定：集中资源建造新一代战列舰，以厚重的装甲、强大的火力和庞大的舰体打造能够正面击溃敌方舰队的海上主力。"
 ITA_naval_develop.1.a: "真理只在大炮射程之内！"